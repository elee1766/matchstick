name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable

      - name: Cache nimble
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: nimble-${{ hashFiles('*.nimble') }}
          restore-keys: nimble-

      - name: Install dependencies
        run: nimble install -y --depsOnly

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build WASM playground
        run: |
          nim c --cpu:wasm32 -d:emscripten -d:noSystem -d:release \
            --cc:clang --clang.exe:emcc --clang.linkerexe:emcc \
            --passC:"-s WASM=1" \
            --passL:"-s EXPORTED_FUNCTIONS=[_loadAndRender] -s EXPORTED_RUNTIME_METHODS=[ccall,cwrap] -s ALLOW_MEMORY_GROWTH=1 -s MODULARIZE=1 -s EXPORT_NAME=createMatchstick" \
            -o:site/static/playground.js site/playground.nim

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
