name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools nftables

      - name: Setup Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable

      - name: Cache nimble packages
        uses: actions/cache@v4
        with:
          path: ~/.nimble
          key: nimble-${{ hashFiles('*.nimble') }}
          restore-keys: nimble-

      - name: Install nimble dependencies
        run: nimble install -y --depsOnly

      - name: Build
        run: |
          nimble build -y
          file matchstick
          ls -lh matchstick

      - name: Unit tests
        run: |
          for t in tests/test_*.nim; do
            echo "--- $(basename $t) ---"
            nim c -r --hints:off --warnings:off "$t"
          done

      - name: Integration tests
        run: |
          for t in tests/integration/test_*.nim; do
            echo "--- $(basename $t) ---"
            nim c -r --hints:off --warnings:off "$t"
          done

      - name: nftables validation
        run: |
          # Enable user namespaces if needed
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true

          echo "--- text format ---"
          unshare --user --net --map-root-user -- \
            sh -c './matchstick render tests/testdata/full.lua 2>/dev/null | nft -c -f -'

          echo "--- json format ---"
          unshare --user --net --map-root-user -- \
            sh -c './matchstick render --json tests/testdata/full.lua 2>/dev/null | nft -j -c -f -'

          echo "--- apply in netns ---"
          unshare --user --net --map-root-user -- \
            sh -c './matchstick apply tests/testdata/full.lua 2>&1'
