# matchstick firewall -- recommended sysctl defaults
#
# Install to /usr/lib/sysctl.d/50-matchstick.conf or /etc/sysctl.d/
# Apply with: sysctl --system

# --- ARP hardening ---
# Prevent ARP spoofing / poisoning attacks
net.ipv4.conf.default.arp_announce = 2
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.default.arp_filter = 1
net.ipv4.conf.all.arp_filter = 1

# --- Redirect protection ---
# Don't accept or send ICMP redirects (prevents MITM routing attacks)
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0

# --- Source routing ---
# Disable source-routed packets (prevents source routing attacks)
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# --- Logging ---
# Suppress kernel firewall log messages in console (still go to syslog)
kernel.printk = 4

# --- Connection tracking ---
# Increase conntrack table size for busy firewalls (default is often 65536)
# Uncomment and adjust for your workload:
# net.netfilter.nf_conntrack_max = 262144

# --- IP forwarding ---
# IMPORTANT: Uncomment these ONLY if this machine routes traffic between zones.
# For a host firewall (no forwarding), leave these commented out.
# If you need forwarding, copy these lines to /etc/sysctl.d/50-ip-forwarding.conf
#
# net.ipv4.conf.all.forwarding = 1
# net.ipv6.conf.all.forwarding = 1
